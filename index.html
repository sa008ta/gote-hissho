/* ================= STORE (localStorage + cookie mirror) ================= */

    const m = document.cookie.match(new RegExp('(?:^|; )' + k + '=([^;]*)'));

  set(k, v) {

  return (s || '').toLowerCase()
    .replace(/[ァ-ヶ]/g, c => String.fromCharCode(c.charCodeAt(0) - 0x60))
    .replace(/[\s　・._\-ー]/g, '');
}
const NG_NORM = NG_WORDS.map(ngNorm);
function hasNG(s) { const n = ngNorm(s); return NG_NORM.some(w => w && n.includes(w)); }
function cleanName(s, fallback) {
  s = (s || '').trim();
  if (!s || !hasNG(s)) return s;
  let out = s;
  for (const w of NG_WORDS) out = out.replace(new RegExp(w.replace(/[.*+?^${}()|[\]\\]/g, '\\$&'), 'gi'), '＊'.repeat(Math.max(2, w.length)));
  return hasNG(out) ? fallback : out;
}
function myName() { return cleanName(store.get('counter_name', ''), 'NONAME') || 'NONAME'; }

/* ================= AUDIO ================= */
let AC = null;
function ac() {
  if (!AC) { try { AC = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) { return null; } }
  if (AC && AC.state === 'suspended') AC.resume();
  return AC;
}
function noiseBuf(dur) {
  const a = ac(); if (!a) return null;
  const b = a.createBuffer(1, Math.max(1, (a.sampleRate * dur) | 0), a.sampleRate);
  const d = b.getChannelData(0);
  for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
  return b;
}
function whoosh(dur, f0, f1, gain) {
  const a = ac(); if (!a) return;
  const src = a.createBufferSource(); src.buffer = noiseBuf(dur);
  const bp = a.createBiquadFilter(); bp.type = 'bandpass'; bp.Q.value = 1.1;
  bp.frequency.setValueAtTime(f0, a.currentTime);
  bp.frequency.exponentialRampToValueAtTime(Math.max(60, f1), a.currentTime + dur);
  const g = a.createGain();
  g.gain.setValueAtTime(gain, a.currentTime);
  g.gain.exponentialRampToValueAtTime(0.001, a.currentTime + dur);
  src.connect(bp); bp.connect(g); g.connect(a.destination);
  src.start(); src.stop(a.currentTime + dur);
}
function tone(f, dur, type, gain, slideTo) {
  const a = ac(); if (!a) return;
  const o = a.createOscillator(), g = a.createGain();
  o.type = type || 'sine';
  o.frequency.setValueAtTime(f, a.currentTime);
  if (slideTo) o.frequency.exponentialRampToValueAtTime(slideTo, a.currentTime + dur);
  g.gain.setValueAtTime(gain, a.currentTime);
  g.gain.exponentialRampToValueAtTime(0.001, a.currentTime + dur);
  o.connect(g); g.connect(a.destination);
  o.start(); o.stop(a.currentTime + dur);
}
/* 会心専用: a bright bell-like parry chime — stacked harmonics, a rising sparkle, and an echo ping */

  tone(1175, 0.42, 'triangle', 0.10);
  tone(2350, 0.55, 'sine', 0.11);
  tone(3520, 0.40, 'sine', 0.055);
  tone(1568, 0.24, 'sine', 0.07, 3136); // rising sparkle
  setTimeout(() => tone(2637, 0.34, 'sine', 0.05), 85); // echo
  setTimeout(() => tone(3520, 0.26, 'sine', 0.03), 170);

const sfx = {

  windup: () => whoosh(0.22, 500, 900, 0.06),
  feint: () => whoosh(0.10, 1400, 700, 0.10),

/* ================= GAME STATE ================= */
const G = {
  screen: 'title',        // title | game | result
  phase: 'idle',          // walk | windup | slash | guarded | kill | fall | recover | reckless | dying
  count: 0,
  plain: 0,               // kills without the ougi — difficulty scales on this, not count
  guardLock: 0,           // mashing 縦/横 breaks the stance — guard input locked until this vt
  best: +(store.get('counter_best', '0') || 0),
  foe: null,              // {swing:'V'|'H', side, feintSwing, isFeint, z, hue, hat, seed}
  phaseT0: 0, phaseDur: 0,
  stance: null,           // {ori:'V'|'H', t} — the guard the player last chose
  counterT: -1,
  shake: 0,
  rushT0: 0,
  vt: 0,                  // virtual clock (ms) — slows down in slow motion
  freezeUntil: 0,         // real-time hitstop
  lastSwing: '',
};
function nowMs() { return G.vt; }

/* foe pose computed each frame for the 3D side.
   swing 'V' = overhead vertical cut (guard with H), swing 'H' = side cut (guard with V). */
function foePose() {
  const f = G.foe;
  if (!f) return { active: false };
  const t = nowMs();
  let swordZ = 0.35, swordX = 0.1, lean = 0, bob = 0, fall = 0, glint = 0, arch = 0, twist = 0;
  const ph = G.phase;
  if (ph === 'fall') return { active: false }; // once the cinematic ends, the body is gone
  const raise = (swing, side, k) => {
    if (swing === 'V') { swordZ = 0.3; swordX = 0.1 + (-0.6 - 0.1) * k; }
    else { swordZ = 0.35 + (side * 1.35 - 0.35) * k; swordX = 0.1; }
  };
  const swingPose = (swing, side, e) => {
    if (swing === 'V') { swordZ = 0.3; swordX = -0.6 + (0.95 + 0.6) * e; }
    else { swordZ = side * 1.35 + (-side * 1.7 - side * 1.35) * e; swordX = 0.1; }
  };
  if (ph === 'walk') {
    const p = clamp((t - G.phaseT0) / G.phaseDur, 0, 1);
    f.z = -13 + (STOP_Z + 13) * (1 - Math.pow(1 - p, 1.6));
    bob = Math.abs(Math.sin(t * 0.011)) * 0.06;
    swordZ = 0.35 + Math.sin(t * 0.011) * 0.08;
  } else if (ph === 'kamai') {
    const p = clamp((t - G.phaseT0) / G.phaseDur, 0, 1);
    f.z = -13 + 7.5 * (1 - Math.pow(1 - p, 1.6));
    bob = Math.abs(Math.sin(t * 0.016)) * 0.07;
    swordZ = 0.35 + Math.sin(t * 0.016) * 0.08;
  } else if (ph === 'kamaiWave') {
    f.z = -5.5; bob = 0;
  } else if (ph === 'kamaiDown') {
    const k = clamp((t - G.phaseT0) / G.phaseDur, 0, 1);
    fall = 1 - Math.pow(1 - k, 2);
    swordZ = 1.3; swordX = 0.7;
    f.z = -5.5;
  } else if (ph === 'windup') {
    const w = G.wind;
    const bodyTell = (swing, side, k) => { // whole body telegraphs the swing
      if (swing === 'V') { arch = -0.24 * k; twist = 0; }
      else { twist = side * 0.6 * k; arch = 0; }
    };
    if (w.stage === 'A') { const k = clamp((t - w.t0) / w.durA, 0, 1); raise(w.swingA, w.sideA, 1 - Math.pow(1 - k, 2)); bodyTell(w.swingA, w.sideA, k); lean = 0.06 * k; }
    else { const k = clamp((t - w.t0) / w.durB, 0, 1); raise(w.swingB, w.sideB, 1 - Math.pow(1 - k, 2)); bodyTell(w.swingB, w.sideB, k); lean = 0.06 * k; glint = (k > 0.8) ? 1 : 0; }
    f.z = STOP_Z;
  } else if (ph === 'slash' || ph === 'dying') {
    const k = clamp((t - G.phaseT0) / G.phaseDur, 0, 1), e = k * k;
    swingPose(f.swing, f.side, e);
    if (f.swing === 'V') arch = -0.24 + 0.42 * e; else twist = f.side * 0.6 * (1 - e);
    lean = 0.22 * e;
    f.z = STOP_Z - 0.25 * e;
  } else if (ph === 'guarded') {
    swingPose(f.swing, f.side, 0.92);
    swordZ += Math.sin(t * 0.09) * 0.012; // blade trembles against the block
    lean = -0.14;
    f.z = STOP_Z - 0.18;
  } else if (ph === 'kill') {
    // he stays standing a beat after being cut, then crumples
    const k = clamp((t - G.phaseT0) / G.phaseDur, 0, 1);
    const fk = clamp((k - 0.78) / 0.22, 0, 1);
    fall = 1 - Math.pow(1 - fk, 2);
    if (fk > 0) { swordZ = 1.3; swordX = 0.7; } else swingPose(f.swing, f.side, 0.92);
    lean = -0.14 + fall * 0.1;
    f.z = STOP_Z;
  } else if (ph === 'fall') {
    fall = 1;
    swordZ = 1.3; swordX = 0.7;
    f.z = STOP_Z - 0.1;
  } else if (ph === 'guardback') {
    // stagger wearing off: he straightens and raises his blade back into a guard
    const k = clamp((t - G.phaseT0) / G.phaseDur, 0, 1);
    swingPose(f.swing, f.side, 0.92);
    swordZ = swordZ + (0.0 - swordZ) * k;
    swordX = swordX + (0.55 - swordX) * k;
    lean = -0.14 * (1 - k);
    f.z = STOP_Z - 0.18 * (1 - k);
  } else if (ph === 'recover') {
    const k = clamp((t - G.phaseT0) / G.phaseDur, 0, 1);
    swingPose(f.swing, f.side, 0.92 * (1 - k));
    lean = -0.14 * (1 - k);
    f.z = STOP_Z - 0.18 * (1 - k);
  } else if (ph === 'reckless') {
    swordZ = 0.0; swordX = 0.55; lean = 0.1; // he snaps his blade up and blocks
    f.z = STOP_Z - 0.15;
  } else if (ph === 'loseKill') {
    // his turn: he dashes past the player, cutting on the way through
    const ct = clamp((t - G.phaseT0) / G.phaseDur, 0, 1);
    const dk = clamp((ct - 0.15) / 0.42, 0, 1);
    const ease = dk * dk * (3 - 2 * dk);
    f.z = (f.dashFrom != null ? f.dashFrom : STOP_Z) + (0.35 - (f.dashFrom != null ? f.dashFrom : STOP_Z)) * ease;
    if (dk <= 0) { swordZ = -1.05; swordX = 0.15; }
    else if (dk < 0.6) { const s = dk / 0.6; swordZ = -1.05 + (1.7 + 1.05) * s; swordX = 0.15; }
    else { swordZ = 1.7; swordX = 0.4; }
    lean = 0.25 * Math.sin(clamp(dk, 0, 1) * Math.PI);
  }
  if (f.type === 'monkey' && ph !== 'walk' && ph !== 'kamai' && ph !== 'kamaiWave' && ph !== 'kamaiDown') {
    // the monkey's arm hangs DOWN from the pivot where a sword points UP:
    // mirror the pose so the hand traces the same line the blade would
    swordZ = -swordZ; swordX = swordX + Math.PI;
  }
  return { active: true, z: f.z, hue: f.hue, hat: f.hat, monkey: f.type === 'monkey', swordZ, swordX, lean, bob, fall, glint, arch, twist, seed: f.seed, sx: f.sx || 1, sy: f.sy || 1 };
}
const STOP_Z = -2.7;

/* player figure pose for the cinematics: on a kill he dashes from the foe's front to his back, cutting on the way through; on a loss he stands and falls */
function playerCutPose() {
  if (G.phase === 'loseKill') {
    const ct = clamp((nowMs() - G.phaseT0) / G.phaseDur, 0, 1);
    const fk = clamp((ct - 0.8) / 0.2, 0, 1);
    return { z: -1.3, swordZ: 0.5, swordX: 0.45, arch: 0, sink: 0, fall: 1 - Math.pow(1 - fk, 2) };
  }
  if (G.phase !== 'kill') return null;
  const ct = clamp((nowMs() - G.phaseT0) / G.phaseDur, 0, 1);
  const dk = clamp((ct - 0.15) / 0.42, 0, 1);
  const ease = dk * dk * (3 - 2 * dk);
  const z = -1.5 + (-4.1 - -1.5) * ease;
  let swordZ, swordX, arch = 0.28 * Math.sin(clamp(dk, 0, 1) * Math.PI);
  if (dk <= 0) { swordZ = -1.15; swordX = 0.3; }                    // drawn back, ready
  else if (dk < 0.55) { const s = dk / 0.55; swordZ = -1.15 + (1.35 + 1.15) * s; swordX = 0.3; } // the cut, mid-pass
  else { swordZ = 1.35; swordX = 0.55; arch = 0.12; }                // followed through, behind him
  return { z, swordZ, swordX, arch, sink: -0.05 * Math.sin(clamp(dk, 0, 1) * Math.PI), fall: 0 };
}

function submitScore(force) {

function loadRanking() {

    }
    const list = Object.values(best).sort((a, b) => b.sc - a.sc).slice(0, 20);
    const myPid = playerId();
    // 送信が届いていなかったら再送する（送信済み記録は端末側だけに残り、失敗すると二度と送られない事故の対策）
    if (G.best > 0 && (!best[myPid] || best[myPid].sc < G.best)) submitScore(true);
    $('rankList').innerHTML = list.length
      ? list.map((e, i) => '<div class="rankRow"><span class="rk">' + (i + 1) + '位</span><span class="rn">' + e.name + '</span><span class="rs">' + e.sc + '人斬り</span></div>').join('')

  }).catch(() => { $('rankList').textContent = '読み込めませんでした'; });
}

function pickSwing() {
  let s = Math.random() < 0.5 ? 'V' : 'H';
  if (s === G.lastSwing && Math.random() < 0.65) s = s === 'V' ? 'H' : 'V';

}

/* enemy types: same duel, different rhythm and silhouette */
const FOE_TYPES = {
  norm:  { windMul: 1,    slashMul: 1,    winMul: 1,    walkMul: 1,    hue: 0x6b543a,  hat: null,  sx: 1,    sy: 1 },
  fast:  { windMul: 0.62, slashMul: 0.85, winMul: 1.15, walkMul: 0.7,  hue: 0x8fb7c9,  hat: false, sx: 0.88, sy: 0.94 },
  heavy: { windMul: 1.45, slashMul: 0.7,  winMul: 0.7,  walkMul: 1.15, hue: 0x383d47,  hat: false, sx: 1.24, sy: 1.12 },
  feint: { windMul: 0.95, slashMul: 1,    winMul: 0.85, walkMul: 1,    hue: 0x6e4a80,  hat: true,  sx: 1,    sy: 1.02 },
  monkey:{ windMul: 0.9,  slashMul: 0.9,  winMul: 1,    walkMul: 0.85, hue: 0x7a5230,  hat: false, sx: 0.95, sy: 0.92 },
};
function foeTypeFor(n) {
  if (n >= 10 && Math.random() < 0.10) return 'monkey'; // hidden foe — not in the 敵の種類 list
  const r = Math.random();
  if (n >= 8) { if (r < 0.25) return 'fast'; if (r < 0.45) return 'heavy'; if (r < 0.70) return 'feint'; }
  else if (n >= 5) { if (r < 0.25) return 'fast'; if (r < 0.45) return 'heavy'; }
  else if (n >= 3) { if (r < 0.25) return 'fast'; }
  return 'norm';
}
function feintChance(type, n) {
  if (type === 'feint') return 0.85;
  if (n < 6) return 0;
  if (type === 'fast') return 0.1;
  if (type === 'heavy') return 0.15;
  return Math.min(0.30 + (n - 6) * 0.02, 0.55);
}
function spawnFoe(delay) {
  const n = G.plain;
  const type = foeTypeFor(n);
  const T = FOE_TYPES[type];
  const windBase = clamp(Math.round((860 - n * 16) * T.windMul), 300, 1300);
  let feints = 0;
  if (Math.random() < feintChance(type, n)) {
    feints = 1;
    if (type === 'feint') { const r = Math.random(); feints = r < 0.5 ? 1 : r < 0.8 ? 2 : 3; } // 達人: strings 1-3 feints together (and sometimes none)
  }
  const isFeint = feints > 0;
  const swing = pickSwing();
  G.foe = {
    swing,
    side: Math.random() < 0.5 ? -1 : 1,
    feintSwing: isFeint ? (swing === 'V' ? 'H' : 'V') : null,
    feintSide: Math.random() < 0.5 ? -1 : 1,
    isFeint, feints,
    type, slashMul: T.slashMul, winMul: T.winMul, sx: T.sx, sy: T.sy,
    z: -13,
    hue: T.hue != null ? T.hue : [0x46586e, 0x6b543a, 0x51663f, 0x71424c, 0x46506b, 0x77603a][(Math.random() * 6) | 0],
    hat: T.hat != null ? T.hat : Math.random() < clamp(0.15 + n * 0.02, 0.15, 0.6),
    seed: (Math.random() * 1e9) | 0,
    windBase,
  };
  G.phase = 'walk';
  G.phaseT0 = nowMs() + (delay || 0);
  G.phaseDur = clamp((470 - n * 14) * T.walkMul, 200, 560);
  G.stance = null;
}
function beginWindup() {
  const f = G.foe, t = nowMs();
  if (f.isFeint) {
    const k = Math.max(1, f.feints || 1);
    const opp = f.swing === 'V' ? 'H' : 'V';
    const fakes = [];
    for (let i = 0; i < k; i++) fakes.push(((k - 1 - i) % 2 === 0) ? opp : f.swing); // alternate, last fake is always the opposite of the real swing
    G.wind = { stage: 'A', swingA: fakes[0], sideA: f.feintSide, swingB: f.swing, sideB: f.side, t0: t, durA: f.windBase * (k > 1 ? 0.5 : 0.62), durB: f.windBase * 0.92, fakes, fi: 0, left: k - 1 };
  } else {
    G.wind = { stage: 'B', swingA: f.swing, sideA: f.side, swingB: f.swing, sideB: f.side, t0: t, durA: 0, durB: f.windBase };
  }
  G.phase = 'windup';
  sfx.windup();
}
function beginSlash() {
  G.phase = 'slash';
  G.phaseT0 = nowMs();
  G.phaseDur = Math.max(80, Math.round(clamp(170 - G.plain * 3, 95, 170) * (G.foe ? G.foe.slashMul : 1))); // the cut itself gets faster as non-ougi kills pile up
  sfx.swing();
}
/* how long the foe stays staggered after a guard — shrinks as kills pile up */
function guardWindow() { return clamp(Math.round((1000 - G.plain * 22) * (G.foe ? G.foe.winMul : 1)), 300, 1150); }

function judge() {
  const t = nowMs();
  const need = G.foe.swing === 'V' ? 'H' : 'V'; // perpendicular block
  const age = G.stance ? t - G.stance.t : 1e9;
  const ok = G.stance && G.stance.ori === need && age <= 920;
  if (ok) {
    const just = age <= 170; // guard pressed in the last 170ms before impact = 会心
    G.guardJust = just;
    if (just) { G.gauge = Math.min(5, (G.gauge || 0) + 1); if (G.gauge >= 5) G.kamaiPending = true; updateGauge(); }
    sfx.clang();
    if (just) justChime();
    if (window.R3D && R3D.burst) R3D.burst('parry');
    G.freezeUntil = performance.now() + (just ? 200 : 90); // hitstop — longer on a just guard
    G.phase = 'guarded';
    G.phaseT0 = t; G.phaseDur = guardWindow(); // window to press 斬る — shorter late-game
    $('slashBtn').classList.add('ready');
    $('slashBtn').classList.toggle('just', just);
  } else {
    playerCut();
  }
}
function playerCut() {
  const t = nowMs();
  sfx.hit();
  $('hitFlash').style.opacity = '1';
  setTimeout(() => $('hitFlash').style.opacity = '0', 260);
  G.shake = 1;
  G.phase = 'dying';
  G.phaseT0 = t; G.phaseDur = 380;
}

function startLoseKill() {

/* the 斬る button: only works right after a successful guard */
function pressSlash() {
  if (G.screen !== 'game' || !G.foe) return;
  if (G.phase === 'kamaiLine' || G.phase === 'kamaiFire') return; // 奥義中はボタン無効
  const t = nowMs();

  if (G.phase === 'guarded') {

    G.counterT = 0;

}
function pressGuard(ori) {
  if (G.screen !== 'game') return;
  if (G.phase === 'kamaiLine' || G.phase === 'kamaiFire') return; // 奥義中はボタン無効
  const t = nowMs();
  if (t < G.guardLock) return; // stance broken by mashing — input locked
  if (G.stance && G.stance.ori !== ori && t - G.stance.t < 160) {
    // flipping 縦/横 faster than a human can read a swing = mashing: the stance collapses
    G.stance = null; G.guardLock = t + 300;

    return;
  }

}

/* ---------- frame ---------- */
let lastT = performance.now();
let lastSeed = -1;
function frame(st) {
  const t = performance.now();
  const dtR = Math.min(0.05, (t - lastT) / 1000);
  lastT = t;
  const dt = dtR * (st.timeScale != null ? (0.35 + 0.65 * st.timeScale) : 1);
  // forward rush after a counter: the grove streams past
  const rush = st.rush || 0;
  if (rush > 0) {
    const dist = 11 * rush * dt;
    for (const m of movers) { m.position.z += dist; if (m.position.z > 4) m.position.z -= 32; }
    pathTex.offset.y -= dist / 3.75;
    for (const m of leaves) { m.position.z += dist * 0.7; if (m.position.z > 2) m.position.z -= 17; }
  }
  // leaves drift
  for (const m of leaves) {
    m.position.y -= m.userData.vy * dt;
    m.position.x += Math.sin(t * 0.001 + m.userData.ph) * 0.15 * dt;    m.rotation.x += dt * 1.3; m.rotation.z += dt * 0.9;
    if (m.position.y < 0.05) { m.position.y = 4.6; m.position.x = (Math.random() - 0.5) * 9; m.position.z = 1 - Math.random() * 15; }
  }
  // enemy
  const f = st.foe;
  if (f && f.active) {
    if (f.seed !== lastSeed) { buildFoe(f.hue, f.hat, f.monkey); lastSeed = f.seed; }
    foeGroup.visible = true;
    foeGroup.position.set(0, f.bob || 0, f.z);
    foeGroup.scale.set(f.sx || 1, f.sy || 1, f.sy || 1);
    foeGroup.rotation.x = (f.fall || 0) * -1.45;
    foeGroup.position.y = (f.bob || 0) - (f.fall || 0) * 0.25;
    if (foeParts) {
      foeParts.pivot.rotation.z = f.swordZ;
      foeParts.pivot.rotation.x = f.swordX;
      foeParts.g.rotation.z = (f.lean || 0) * 0.4;
      foeParts.g.rotation.x = f.arch || 0;
      foeParts.g.rotation.y = f.twist || 0;
      const bm = foeParts.sword.userData.bladeMat;
      if (bm) bm.emissive.setHex(f.glint ? 0xccddff : 0x222630);
    }
  } else foeGroup.visible = false;
  // player: first-person sword in play, full figure in the kill cinematic
  if (st.killCam && st.playerCut) {
    swordRig.visible = false;
    playerGroup.visible = true;
    const pc = st.playerCut;
    playerGroup.position.set(0.35, 0, pc.z);
    playerGroup.rotation.x = (pc.fall || 0) * 1.45;
    if (playerParts) {
      playerParts.pivot.rotation.z = pc.swordZ;
      playerParts.pivot.rotation.x = pc.swordX;
      playerParts.g.rotation.x = pc.arch || 0;
      playerParts.g.position.y = pc.sink || 0;
    }
  } else {
    playerGroup.visible = false;
    playerGroup.rotation.x = 0;
    swordRig.visible = true;
    // 奥義かまいたち: the shockwave runs down the lane
    if (st.kamai != null && st.kamai >= 0) {
      const k = st.kamai, e = k * k * (3 - 2 * k);
      const fade = Math.sin(Math.min(1, k * 1.15) * Math.PI);
      if (st.kamaiKind === 'wind') {
        kamaiGroup.visible = false;
        kamaiCrescent.visible = true;
        kamaiCrescent.position.set(0, 1.55, -1.0 - 13.5 * e);
        kamaiCrescent.rotation.set(0, 0.5, 2.25 - k * 1.1);
        const s = 1 + k * 0.7;
        kamaiCrescent.scale.set(s, s * 1.5, s);
        kamaiCrescent.children[0].material.opacity = 0.4 * fade;
        kamaiCrescent.children[1].material.opacity = 0.95 * fade;
      } else if (st.kamaiKind === 'guren') {
        kamaiCrescent.visible = false;
        kamaiGroup.visible = true;
        kamaiCoreMat.color.setHex(0xffe9b0); kamaiHaloMat.color.setHex(0xff5a1e);
        kamaiGroup.position.set(0, 1.9, -0.8 - 13.7 * e);
        kamaiGroup.scale.set(1.7 + Math.sin(t * 0.045) * 0.25, 1.3, 1); // flames flicker
        kamaiGroup.rotation.y = 0.35;
        kamaiGroup.children[0].material.opacity = 0.45 * fade;
        kamaiGroup.children[1].material.opacity = 0.95 * fade;
      } else {
        kamaiGroup.visible = false; kamaiCrescent.visible = false;
      }
    } else { kamaiGroup.visible = false; kamaiCrescent.visible = false; }
    // the kamaitachi line-up: five foes down the lane
    const kfs = st.kamaiFoes || [];
    for (let i = 0; i < 5; i++) {
      const gr = kamaiGroups[i], e = kfs[i];
      if (e && e.active) {
        if (gr.userData.seed !== e.seed) { buildFoeInto(gr, e.hue, e.hat); gr.userData.seed = e.seed; }
        gr.visible = true;
        gr.position.set(e.x || 0, e.y || 0, e.z);
        gr.rotation.x = e.rot || 0;
        gr.scale.set(e.sx || 1, e.sy || 1, e.sy || 1);
      } else gr.visible = false;
    }
    let target = GUARD_POSES[st.guardOri || 'idle'] || GUARD_POSES.idle;
    if (st.fpSlash >= 0) target = { p: [-0.12, -0.05, -1.0], rz: -1.9, rx: -0.4 }; // your own unguarded swing
    if (st.kamaiSwing != null && st.kamaiSwing >= 0) {
      const p = st.kamaiSwing;
      if (st.kamaiKind === 'issen') {
        // 居合: a single near-invisible horizontal draw — most of the motion in a flash
        const A = { p: [-0.30, 0.02, -0.98], rz: 0.65, rx: -0.30 };
        const B = { p: [0.28, -0.02, -1.02], rz: -2.05, rx: -0.15 };
        const k = p < 0.25 ? p / 0.25 * 0.15 : 0.15 + Math.min(1, (p - 0.25) / 0.22) * 0.85, e = k;
        target = { p: [A.p[0] + (B.p[0] - A.p[0]) * e, A.p[1] + (B.p[1] - A.p[1]) * e, A.p[2] + (B.p[2] - A.p[2]) * e], rz: A.rz + (B.rz - A.rz) * e, rx: A.rx + (B.rx - A.rx) * e };
      } else {
        // 風・炎: raise the sword high, then one big vertical chop
        const A = { p: [0.02, 0.30, -0.92], rz: -0.12, rx: -0.55 };  // raised
        const B = { p: [0.02, -0.34, -1.06], rz: 0.30, rx: 0.95 };   // chopped through
        if (p < 0.32) { const k = p / 0.32, e = 1 - Math.pow(1 - k, 2); target = { p: [A.p[0], A.p[1] * e, A.p[2]], rz: A.rz * e, rx: A.rx * e }; }
        else { const k = Math.min(1, (p - 0.32) / 0.30), e = k * k; target = { p: [A.p[0], A.p[1] + (B.p[1] - A.p[1]) * e, A.p[2] + (B.p[2] - A.p[2]) * e], rz: A.rz + (B.rz - A.rz) * e, rx: A.rx + (B.rx - A.rx) * e }; }
      }
    }
    const L = 1 - Math.exp(-dt * (st.fpSlash >= 0 || (st.kamaiSwing != null && st.kamaiSwing >= 0) ? 30 : 20));
    curPose.p[0] += (target.p[0] - curPose.p[0]) * L;
    curPose.p[1] += (target.p[1] - curPose.p[1]) * L;
    curPose.p[2] += (target.p[2] - curPose.p[2]) * L;
    curPose.rz += (target.rz - curPose.rz) * L;
    curPose.rx += (target.rx - curPose.rx) * L;
    swordRig.position.set(curPose.p[0], curPose.p[1], curPose.p[2]);
    swordRig.rotation.set(0, 0, 0);
    mySword.rotation.z = curPose.rz;
    mySword.rotation.x = curPose.rx;
    if (!st.guardOri && st.counterT < 0) swordRig.position.y += Math.sin(t * 0.0016) * 0.006;
  }
  // grove trees on the camera side step aside during the side-view cinematics
  if (!!st.killCam !== frame._kc) {
    frame._kc = !!st.killCam;
    for (const m of movers) m.visible = !(frame._kc && m.position.x > 1.8 && m.position.x < 6.5 && m.position.z > -9.5 && m.position.z < 3.5);
  }
  // sparks
  for (const m of sparks) {
    if (m.userData.life <= 0) continue;
    m.userData.life -= dt;
    if (m.userData.life <= 0) { m.visible = false; continue; }
    m.position.addScaledVector(m.userData.v, dt);
    m.userData.v.y -= 5.5 * dt;
    m.lookAt(camera.position);
  }
  // camera: side view for the kill cinematic, first person otherwise
  const sh = st.shake || 0;
  if (st.cine) {
    if (st.cine === 'just') { camera.position.set(2.6, 0.5, -5.2); camera.lookAt(0, 1.05, -2.8); }
    else if (st.cine === 'lose') { camera.position.set(3.4, 0.85, 2.6); camera.lookAt(0, 1.15, -1.2); }
    else { camera.position.set(3.6, 0.85, -5.6); camera.lookAt(0, 1.15, -2.7); }
  } else {
    camera.position.x = sh ? (Math.random() - 0.5) * 0.07 * sh : 0;
    camera.position.y = 1.52 + (sh ? (Math.random() - 0.5) * 0.07 * sh : 0) + (rush > 0 ? Math.abs(Math.sin(t * 0.028)) * 0.035 * rush : 0);
    camera.position.z = 0.7;
    camera.lookAt(0, 1.22, -4);
  }
  renderer.render(scene, camera);
}
function resize() {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
}
addEventListener('resize', resize);
window.R3D = { frame, burst, resize, snapshot: () => { try { return renderer.domElement.toDataURL('image/png'); } catch (e) { return null; } } };
</script>
